# Mercadito — production setup.
#
#   1. Copy .env.example to .env and set POSTGRES_PASSWORD (and TZ).
#   2. docker compose up -d --build
#   3. Open http://localhost:3000
#
# For development with live reload see docker-compose.dev.yml.

services:
  app:
    image: mercadito:local
    build:
      context: .
      target: production
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mercadito}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-mercadito}?schema=public
      TZ: ${TZ:-UTC}
    ports:
      # 127.0.0.1 = only this computer. Use BIND_ADDRESS=0.0.0.0 for your home network.
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mercadito}
      POSTGRES_USER: ${POSTGRES_USER:-mercadito}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-UTC}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Optional database browser: docker compose --profile tools up -d adminer
  adminer:
    image: adminer:5
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"

volumes:
  postgres_data:
