# Optional HTTPS with Caddy. Usage (from the project folder):
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.https.yml up -d --build
#
# Set SITE_ADDRESS in .env (a domain, a local IP, or localhost).

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
